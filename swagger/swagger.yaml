openapi: 3.0.4
info:
  title: BCT Sales REST API
  description: |-
    BCT Sales REST API
  termsOfService: https://swagger.io/terms/
  contact:
    email: frederic.vogels+bctsales@gmail.com
  version: 1.10.3
externalDocs:
  description: Find out more about BCT Sales Backend
  url: https://github.com/bct-sales/go-backend
tags:
  - name: user
    description: User related functionality
  - name: admin
    description: Admin-accessible functionality
  - name: item
    description: Item related functionality
paths:
  /api/v1/users:
    get:
      tags:
        - user
        - admin
      summary: List all users.
      description: >
        Returns a list of all users.
        This operation is reserved for admins.
      operationId: ListUsers
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              type: array
              items:
                $ref: '#/components/schemas/GetUsersUserData'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailureResponse'
        '403':
          description: Only admins are allowed to perform this operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailureResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailureResponse'
components:
  schemas:
    GetUsersUserData:
      properties:
        id:
          type: integer
          format: int64
          example: 10
        password:
          type: string
          example: azer1234
        role:
          type: string
          enum:
            - admin
            - seller
            - cashier
          example: seller
        createdAt:
          $ref: '#/components/schemas/DateTime'
        lastActivity:
          $ref: '#/components/schemas/DateTime'
    DateTime:
      properties:
        year:
          type: integer
        month:
          type: integer
        day:
          type: integer
        hour:
          type: integer
        minute:
          type: integer
        second:
          type: integer
        timestamp:
          type: integer
          format: int64
    FailureResponse:
      properties:
        type:
          type: string
          enum:
            - unknown
            - invalid_request
            - invalid_uri_parameters
            - invalid_user_id
            - invalid_item_id
            - invalid_sale_id
            - no_such_item
            - no_such_user
            - no_such_sale
            - wrong_user
            - no_such_category
            - wrong_password
            - item_frozen
            - invalid_price
            - wrong_role
            - duplicate_item_in_sale
            - wrong_seller
            - invalid_item_description
            - missing_session_id
            - no_such_session
            - missing_items
            - invalid_layout
        details:
          type: string